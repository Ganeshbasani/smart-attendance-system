name: CI

on:
  push:
    branches: [main, upgrade/production-hardening]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-test-secret-key-which-is-sufficiently-long-32"
          ADMIN_EMAIL: "admin@test.com"
          RATE_LIMIT_ENABLED: "false"
        run: python -m pytest tests/ -v --tb=short

      # A merge that leaves two alembic heads would break every later
      # `alembic upgrade head` (including app startup). Fail fast here.
      - name: Check migrations have a single head
        run: |
          heads="$(alembic heads | grep -c .)"
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly 1 alembic head, found $heads:"
            alembic heads
            exit 1
          fi
          alembic heads

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: "true"
        run: npx craco test --watchAll=false

      # CI=true makes ESLint warnings fail the build (CRA behavior), so
      # lint regressions cannot reach main silently.
      - name: Build
        env:
          CI: "true"
        run: npm run build
