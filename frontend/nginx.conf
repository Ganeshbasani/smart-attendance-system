server {
    listen 80;
    server_name _;

    server_tokens off;

    # Compression for text assets (nginx:alpine ships the gzip module).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # NOTE: in nginx, a location-level add_header REPLACES the server-level
    # ones instead of appending, so the security headers are repeated in
    # every location below.

    # SPA routing: fall back to index.html for client-side routes.
    # index.html must never be cached, or a deploy can serve a stale
    # index.html that references hashed bundles that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Cache static assets aggressively (filenames are content-hashed).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
